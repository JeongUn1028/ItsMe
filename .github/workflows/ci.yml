name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · type-check · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit test (coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # 공개 페이지가 프리렌더되는지 확인한다 (#57)
      - name: Assert static routes
        run: npm run test:static


  e2e:
    name: e2e (desktop · mobile)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 아티팩트로 넘기는 대신 여기서 다시 빌드한다.
      # 빌드 자체는 몇 초라 upload/download 의 글롭 규칙에 의존하는 것보다 안정적이다.
      - name: Build
        run: npm run build

      # CI 에는 시스템 Chrome 이 없으므로 번들 Chromium 을 설치합니다.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
