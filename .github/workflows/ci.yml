name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · type-check · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit test (coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # 공개 페이지가 프리렌더되는지 확인한다 (#57)
      - name: Assert static routes
        run: npm run test:static

      # 빌드 산출물을 e2e 잡에서 재사용해 빌드를 두 번 하지 않습니다.
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          # 캐시 디렉터리는 용량만 크고 실행에 필요 없습니다.
          path: |
            .next
            !.next/cache
          retention-days: 1

  e2e:
    name: e2e (desktop · mobile)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      # CI 에는 시스템 Chrome 이 없으므로 번들 Chromium 을 설치합니다.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
